<!doctype html>
<!--
  index.html — the structure of the page.
  The browser reads this file top to bottom: it builds the page from the tags,
  applies style.css for the look, then runs the <script> files for behaviour.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter Sheet Reconciler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Counter Sheet Reconciler</h1>
    <p class="note">Your files never leave this computer. Everything runs inside this browser tab.</p>
  </header>

  <main>
    <section class="fields">
      <label>Client <input id="client" type="text" placeholder="e.g. City Nursing Home"></label>
      <label>Quarter <input id="quarter" type="text" placeholder="e.g. Q2 FY 2026-27"></label>
    </section>

    <!-- app.js fills this with one card per counter, copied from the template below. -->
    <section id="cards" class="cards"></section>

    <!-- The row table for whichever "Show rows" button was clicked last. -->
    <section id="detail" hidden>
      <h2 id="detail-title"></h2>
      <div id="detail-table" class="rows"></div>
    </section>

    <section class="actions">
      <button id="add-counter" type="button" class="link">+ Add counter</button>
      <span class="note">Same rule for cash, UPI, card and bank transfer.</span>
      <button id="submit" type="button" class="primary">Submit</button>
    </section>

    <p id="message" class="message" hidden></p>

    <section id="results" hidden>
      <h2>Summary</h2>
      <table id="summary" class="grid"></table>
      <div class="downloads" id="downloads"></div>
    </section>
  </main>

  <!-- A <template> is not shown. app.js clones it for each counter card. -->
  <template id="card-template">
    <article class="card">
      <input class="name" type="text" aria-label="Counter name">
      <label class="drop">
        <input class="file" type="file" accept=".xlsx,.xls,.csv">
        <span class="file-label">Choose .xlsx, .xls or .csv</span>
      </label>
      <div class="columns" hidden>
        <label>Amount column <select class="amount-col"></select></label>
        <span class="info"></span>
      </div>
      <label class="amount-label">Amount per patient (₹)
        <input class="amount" type="number" min="1" step="0.01" inputmode="decimal">
      </label>
      <div class="alerts"></div>
    </article>
  </template>

  <!-- Scripts run in this order: the Excel library, the rule, then the page code. -->
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
